{% extends "base.html" %}
{% block content %}
<div class="page-heading"><div><h2>All transactions</h2><p>Track every rupee coming in and going out.</p></div><button class="btn btn-primary" data-add-transaction>＋ Add transaction</button></div>
<div class="panel filters-panel"><div class="filter-search">⌕ <input id="transactionSearch" placeholder="Search transactions..."></div><select id="typeFilter"><option value="all">All types</option><option value="income">Income</option><option value="expense">Expenses</option></select><select id="categoryFilter"><option value="all">All categories</option></select><input type="month" id="transactionMonth" class="month-input"></div>
<div class="stat-grid compact-stats"><article class="stat-card"><span class="muted">Transactions shown</span><strong id="transactionCount">0</strong></article><article class="stat-card"><span class="muted">Income</span><strong id="transactionIncome">₹0</strong></article><article class="stat-card"><span class="muted">Expenses</span><strong id="transactionExpenses">₹0</strong></article></div>
<div class="panel table-panel"><div class="panel-heading"><div><h3>Transaction history</h3><p>Review, edit or remove an entry.</p></div><button class="btn btn-light" id="exportCsv">↓ Export CSV</button></div><div class="table-scroll"><table><thead><tr><th>TRANSACTION</th><th>CATEGORY</th><th>DATE</th><th>AMOUNT</th><th>TYPE</th><th>ACTIONS</th></tr></thead><tbody id="allTransactions"></tbody></table></div><div class="empty-state hidden" id="transactionEmpty">No transactions match your filters.</div></div>
{% endblock %}
